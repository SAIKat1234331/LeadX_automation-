  <body class="bg-[#0B0B0B] text-[#FFFFFF] font-sans antialiased selection:bg-[#00FF88] selection:text-[#0B0B0B]">
    <div id="root"></div>

    <!-- Hidden static form for Netlify build discovery -->
    <form name="leadx-project-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="leadx-project-enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="text" name="businessName" />
      <input type="text" name="serviceRequired" />
      <textarea name="projectDescription"></textarea>
      <input type="text" name="budgetRange" />
      <input type="text" name="contactMethod" />
      <input type="checkbox" name="consent" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
